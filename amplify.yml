version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(DATABASE_URL|DIRECT_URL|AUTH_SECRET|AUTH_URL|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|KAKAO_CLIENT_ID|KAKAO_CLIENT_SECRET|NAVER_CLIENT_ID|NAVER_CLIENT_SECRET|CRON_SECRET|S3_BUCKET_NAME|S3_REGION|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|VWORLD_API_KEY|INVESTOR_PAGE_PASSWORD|NEXT_PUBLIC_NAVER_MAP_CLIENT_ID|NEXT_PUBLIC_GOOGLE_MAPS_API_KEY|NEXT_PUBLIC_NICEPAY_CLIENT_ID|NICEPAY_SECRET_KEY|NICEPAY_ENV)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
