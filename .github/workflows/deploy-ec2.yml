name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MDFARM_DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MDFARM_DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Trigger deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.MDFARM_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["bash /opt/modu-nongbu/deploy/deploy.sh"]' \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.MDFARM_EC2_INSTANCE_ID }}" || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.MDFARM_EC2_INSTANCE_ID }}"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.MDFARM_EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          echo "Deploy status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy failed with status $STATUS"
            exit 1
          fi
